<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BiliKiller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="masthead">
      <div class="masthead-id">
        <span class="seal" aria-hidden="true">B</span>
        <div class="masthead-text">
          <h1>BiliKiller</h1>
          <p>哔哩哔哩防沉迷助手</p>
        </div>
      </div>
      <label class="switch" title="功能总开关">
        <input type="checkbox" id="toggle-enabled">
        <span class="slider"></span>
      </label>
    </header>

    <section class="hero">
      <div class="hero-head">
        <span class="eyebrow">今日观看</span>
        <span class="hero-meta">
          <span id="today-visits">访问 0 次</span>
          <i class="sep"></i>
          <span id="next-reminder">--</span>
        </span>
      </div>
      <p class="hero-value" id="today-duration">--</p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>近 7 天</h2>
        <span>分钟 · 每日</span>
      </div>
      <div class="chart" id="chart-7d"></div>
    </section>

    <section class="panel panel-list">
      <div class="panel-head">
        <h2>净化与提醒</h2>
        <span>即时生效</span>
      </div>
      <div class="toggles" id="toggles"></div>
    </section>

    <footer class="footer">
      <button id="open-options" class="link-btn" type="button">
        <span>使用报表与完整设置</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </footer>
  </div>

  <script src="../shared/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
